name: 'OpenSpec Plan'

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  openspec-plan:
    name: 'OpenSpec Plan'
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------------------
      # Work on TEC products is planned before it is written, and the plan lives in the
      # shared store rather than in this repository. A ticket and a complete,
      # valid active plan are required, including for automated PRs.
      # ------------------------------------------------------------------------------
      - name: Verify the plan exists
        uses: the-events-calendar/actions/.github/actions/verify-openspec-plan@main
        with:
          github-token: ${{ secrets.GHA_BOT_TOKEN_MANAGER }}
          enforcement: 'block'
