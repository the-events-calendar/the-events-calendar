name: "Release receiver"

# The only workflow a plugin's public repository (a mirror of the TEC plugins monorepo) keeps.
# The monorepo's Release on GH dispatches it after merging, tagging and syncing a release: it
# publishes the GitHub release here, tagged with the bare version, at the mirror commit holding the
# released code, with the changelog and the production zip.
#
# Installed at cutover as .github/workflows/release.yml in every mirror, replacing its other
# workflows; the sync keeps a mirror's own workflows, so it stays the only one. Its source is
# tools/mirror/release.yml in the monorepo, next to the mirror's pull request template.

run-name: "Release ${{ inputs.version }} (${{ inputs.request-id }})"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 6.19.0 or 6.18.3.1
        required: true
        type: string
      target:
        description: Full hash of the mirror commit to release
        required: true
        type: string
      title:
        description: Release title
        required: true
        type: string
      notes:
        description: Release notes, the version's changelog
        required: false
        type: string
      zip-url:
        description: HTTPS link to the production zip. Empty releases without a zip
        required: false
        type: string
      zip-name:
        description: The asset's name before the version, the plugin's .puprc zip_name (events-calendar-pro for events-pro). Empty uses the repository name
        required: false
        type: string
      request-id:
        description: The dispatching run's id, so it can find this run
        required: true
        type: string

permissions:
  contents: read

# One publication at a time across versions: two runs that both read the same Latest release would
# each mark theirs Latest, and the one finishing last would win. queue: max keeps every pending run.
concurrency:
  group: release-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      # Anyone with write access could dispatch this; only the monorepo's bot may.
      - name: Check the request
        env:
          ACTOR: ${{ github.actor }}
          BOT: ${{ vars.RELEASE_BOT_LOGIN }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          ZIP_URL: ${{ inputs.zip-url }}
          ZIP_NAME: ${{ inputs.zip-name }}
        run: |
          if [ -z "$BOT" ] || [ "$ACTOR" != "$BOT" ]; then
            echo "::error::Only the monorepo's release bot (vars.RELEASE_BOT_LOGIN) may publish here, not '$ACTOR'. Release from the monorepo with Release on GH."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version: three or four numeric parts."
            exit 1
          fi
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target must be a full commit hash, got '$TARGET'."
            exit 1
          fi
          if [ -n "$ZIP_URL" ] && [[ "$ZIP_URL" != https://* ]]; then
            echo "::error::zip-url must be an HTTPS link."
            exit 1
          fi
          # It becomes a file name.
          if ! [[ "$ZIP_NAME" =~ ^[A-Za-z0-9._-]*$ ]]; then
            echo "::error::zip-name must be a plain file name, got '$ZIP_NAME'."
            exit 1
          fi

      - name: Check the target is on main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::$TARGET is not on main ($status): only a commit the sync wrote is released."
            exit 1
          fi

      # release-publish reads the notes and the assets relative to the workspace.
      - name: Download and check the zip
        id: zip
        if: inputs.zip-url != ''
        env:
          ZIP_URL: ${{ inputs.zip-url }}
          VERSION: ${{ inputs.version }}
          NAME: ${{ inputs.zip-name || github.event.repository.name }}
        run: |
          set -euo pipefail
          zip="$NAME.$VERSION.zip"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 600 \
            --output "$GITHUB_WORKSPACE/$zip" "$ZIP_URL"
          echo "path=$zip" >> "$GITHUB_OUTPUT"

      - name: Write the notes
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%s\n' "$NOTES" > "$GITHUB_WORKSPACE/notes.md"

      # Skips a release that already exists, so a repeated Release on GH completes.
      - name: Publish the release
        id: publish
        uses: the-events-calendar/actions/.github/actions/release-publish@0ab353c3ca88c4c4116c1ace11f282159e47e416 # main
        with:
          version: ${{ inputs.version }}
          target: ${{ inputs.target }}
          title: ${{ inputs.title }}
          notes-file: notes.md
          files: ${{ steps.zip.outputs.path }}
          token: ${{ secrets.GHA_BOT_TOKEN_MANAGER }}

      - name: Summary
        env:
          URL: ${{ steps.publish.outputs.release-url }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          echo "Release $PUBLISHED: $URL" >> "$GITHUB_STEP_SUMMARY"
