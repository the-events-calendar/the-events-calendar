name: Check changelog

on:
  pull_request:
    # edited: a [skip-changelog] marker added to or removed from the body must re-run the check.
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '.github/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The check runs bin/check-changelog.sh from the pull request itself, so bound the
# token it can see and keep it out of .git/config. The base-branch fetch below
# authenticates on its own for the private repos.
permissions:
  contents: read

jobs:
  check-changelog:
    name:    Check changelog
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.body, '[skip-changelog]')"
    steps:
      # clone the repository
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1000
          submodules: recursive
          persist-credentials: false
      # setup Node
      - name: Configure Node environment
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      # Fetch the target branch before running the check. The token lives only in this
      # step's environment and is passed per command, so nothing later can read it.
      - name: Fetch the target origin branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch origin "$GITHUB_BASE_REF"
      # Check if any changelog file is added when comparing the current branch vs the target branch.
      - name: Check changelog
        run: bash bin/check-changelog.sh origin/$GITHUB_BASE_REF HEAD
